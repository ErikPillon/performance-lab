server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # Same-origin proxy to the read API. Keeping the browser on one origin
    # means no CORS and no build-time API URL, so one image runs anywhere.
    location /api/ {
        proxy_pass http://api:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream responses can be a few hundred KB and take a moment to build.
        proxy_read_timeout 120s;
    }

    # Hashed asset filenames are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: /activities/:id is a React route, not a file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
