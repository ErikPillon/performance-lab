# Infra runs by default; application services live behind the `apps` profile so
# you can iterate on them locally against dockerised Postgres/Redis/MinIO:
#   npm run infra:up          -> postgres + redis + minio only
#   docker compose --profile apps up -d   -> everything
name: performance-lab

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-performance_lab}
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab} -d ${POSTGRES_DB:-performance_lab}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6380:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-lab-access-key}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    ports: ["9100:9000", "9101:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket and exits. Idempotent.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lab-access-key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-performance-lab}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc version enable local/$${S3_BUCKET} &&
      echo 'bucket ready: '$${S3_BUCKET}"

  analytics:
    profiles: ["apps"]
    build: ./services/analytics
    restart: unless-stopped
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lab-access-key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-performance-lab}
      S3_REGION: ${S3_REGION:-us-east-1}
    ports: ["8001:8001"]
    depends_on:
      minio: { condition: service_healthy }

  api:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lab}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-performance_lab}
      REDIS_URL: redis://redis:6379
      ANALYTICS_URL: http://analytics:8001
      API_PORT: "8003"
      # The dashboard's own origin. Wildcards cannot carry credentials, and the
      # session cookie is a credential.
      CORS_ORIGIN: ${AUTH_BASE_URL:-http://localhost:3100}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:3100}
      AUTH_ALLOW_SIGNUP: ${AUTH_ALLOW_SIGNUP:-true}
      # Encrypts third-party OAuth tokens at rest. Empty means the Strava
      # connector refuses to store anything rather than storing it clear.
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
    ports: ["8003:8003"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      analytics: { condition: service_started }

  ingest-worker:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: services/ingest-worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lab}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-performance_lab}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lab-access-key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-performance-lab}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
      ANALYTICS_URL: http://analytics:8001
      INGEST_PORT: "8002"
      # The sync refreshes tokens as it runs, so the worker needs the
      # same credentials the API does.
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
    ports: ["8002:8002"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  web:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # An IP or *.localhost address gets Caddy's internal CA; a real hostname
      # triggers ACME. Changing this one variable is the whole upgrade path.
      SITE_ADDRESS: ${SITE_ADDRESS:-https://localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
      ACME_CA_DIRECTIVE: ${ACME_CA_DIRECTIVE:-}
      # Only read when SITE_ADDRESS is a real hostname needing a DNS-01 challenge.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    ports:
      - "${HTTP_PORT:-3100}:80"
      - "${HTTPS_PORT:-3443}:443"
    volumes:
      # Certificates and the internal CA root survive restarts. Losing this
      # means re-issuing, and on a public certificate that burns rate limit.
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      # Healthy, not merely started: the edge proxies to the API on the first
      # request, and `service_started` lets the page load before the API is
      # listening — the visitor gets a connection refused rather than a chart.
      api: { condition: service_healthy }

volumes:
  caddydata:
  caddyconfig:
  pgdata:
  redisdata:
  miniodata:
