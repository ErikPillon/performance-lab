[project]
name = "lab-analytics"
version = "0.1.0"
description = "FIT parsing, normalisation and training analytics for performance-lab"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "fitparse>=1.2",
    "numpy>=2.1",
    "polars>=1.17",
    "pyarrow>=18.1",
    "boto3>=1.35",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "duckdb>=1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
